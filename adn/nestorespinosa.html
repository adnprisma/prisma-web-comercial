<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5EEE7">
<title>Ing. Néstor Espinosa López · PRISMA</title>
<style>
:root{--beige:#F5EEE7;--carbon:#1A1A1A;--coral:#FF5A36}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px;background:var(--beige);color:var(--carbon);font-family:"Google Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:490px;padding:52px 44px 36px;background:#fffaf5;border:1px solid rgba(26,26,26,.08);border-radius:24px;box-shadow:0 18px 55px rgba(26,26,26,.045)}
.logo{display:block;width:146px;height:auto;margin-bottom:58px}
h1{font-size:34px;line-height:1.16;letter-spacing:-1.15px;font-weight:600;margin:0 0 13px}
h1 small{display:block;font-size:16px;font-weight:400;letter-spacing:0;margin-bottom:9px}
.role{margin:0;color:#696057;font-size:16px;line-height:1.5}
.phone{display:inline-block;margin:33px 0 25px;color:var(--carbon);text-decoration:none;font-size:23px;letter-spacing:.4px;font-weight:500}
.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}
.button{display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px;border-radius:12px;text-decoration:none;font-size:15px;font-weight:600;transition:background .15s,transform .15s}
.primary{background:var(--coral);color:var(--carbon)}
.secondary{border:1px solid #d8cec4;color:var(--carbon)}
.button:hover{transform:translateY(-2px)}
.primary:hover{background:#ff6c4c}.secondary:hover{background:var(--beige)}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.web{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e6ddd4;margin-top:35px;padding-top:24px;color:var(--carbon);text-decoration:none;font-size:15px}
a:focus-visible{outline:3px solid var(--carbon);outline-offset:5px}
@media(max-width:420px){body{padding:18px}.card{padding:38px 28px 30px;border-radius:20px}.logo{margin-bottom:46px;width:132px}h1{font-size:30px}.button{font-size:14px}}
@media(prefers-reduced-motion:reduce){.button{transition:none}.button:hover{transform:none}}
</style>
</head>
